name = "samimi-gems-bot"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NARA_BASE = "https://router.bynara.id/v1"
MODEL = "mimo-v2.5-free"
ALLOWED_USER_ID = "93255700"

# Cron: refresh free-model list from Nara router every Monday 06:00 UTC
[triggers]
crons = ["0 6 * * 1"]

# KV namespace GEMS_KV
[[kv_namespaces]]
binding = "GEMS_KV"
id = "1f0b29a1db004f40b7849fbd59613965"
